name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # bubblewrap lets the containment integration test actually run instead
      # of being skipped. It is optional at runtime.
      - name: Install sandbox tooling
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # --ignore-scripts: this repo ships no install hooks and should not run
      # any from transitive dependencies either.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev || true

      - name: Smoke test the built CLI
        run: node dist/cli.js --help
